<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AimThree</title>
  </head>
  <body>
    <div id="ui-layer">
      <div id="main-menu">
        <div class="menu-content">
            <h1>AIM THREE</h1>
            
            <div class="setting-group" style="text-align: center;">
                <label style="justify-content: center;">DURÉE</label>
                <div class="duration-selector">
                    <button class="duration-btn" data-time="30">30s</button>
                    <button class="duration-btn active" data-time="60">60s</button>
                    <button class="duration-btn" data-time="90">90s</button>
                </div>
            </div>

            <div class="menu-buttons">
                <button id="btn-static">MODE RÉFLEXE</button>
                <button id="btn-tracking">MODE TRACKING</button>
                <button id="btn-parkour">MODE PARKOUR</button>
                <button id="btn-settings-main">PARAMÈTRES</button>
            </div>
            <p class="instructions">ZQSD Déplacer • MAJ Sprinter • ESPACE Sauter</p>
        </div>
      </div>

      <div id="end-screen" style="display: none;">
        <div class="menu-content">
            <h1>FIN DE PARTIE</h1>
            
            <div class="stats-grid">
                <div class="stat-item">SCORE <span id="final-score">0</span></div>
                <div class="stat-item">PRÉCISION <span id="final-accuracy">0%</span></div>
                <div class="stat-item">TOUCHÉS <span id="final-hits">0</span></div>
                <div class="stat-item">RATÉS <span id="final-misses">0</span></div>
            </div>

            <div class="menu-buttons">
                <button id="btn-retry">RÉESSAYER</button>
                <button id="btn-restart">MENU PRINCIPAL</button>
            </div>
        </div>
      </div>

      <div id="pause-menu" style="display: none;">
        <div class="menu-content">
            <h1>PAUSE</h1>
            <div class="menu-buttons">
                <button id="btn-resume">REPRENDRE</button>
                <button id="btn-settings-pause">PARAMÈTRES</button>
                <button id="btn-quit">MENU PRINCIPAL</button>
            </div>
        </div>
    </div>

    <div id="settings-menu" style="display: none;">
        <div class="menu-content">
            <h1>PARAMÈTRES</h1>
            
            <div class="setting-group">
                <label>SENSIBILITÉ <span id="sens-value">1.0</span></label>
                <input type="range" id="sens-slider" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>

            <div class="setting-group">
                <label>STYLE DE VISEUR</label>
                <div class="crosshair-selector">
                    <button class="crosshair-btn" data-style="dot">POINT</button>
                    <button class="crosshair-btn" data-style="cross">CROIX</button>
                    <button class="crosshair-btn" data-style="circle">CERCLE</button>
                </div>
            </div>

            <div class="menu-buttons">
                <button id="btn-back">RETOUR</button>
            </div>
        </div>
    </div>

      <div id="crosshair" style="display: none;"></div>
      <div id="hud" style="display: none;">
        <div id="score">Score : 0</div>
        <div id="timer">Temps : 0s</div>
        <div id="hits">Touchés : 0</div>
        <div id="height" style="display: none;">Hauteur : 0m</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
